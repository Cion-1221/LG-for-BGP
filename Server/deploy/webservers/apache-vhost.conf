# ==============================================================================
# Apache 2.4 Configuration for Separated Frontend (UI/dist) + Backend (lg-server)
# File Path on Debian 13 / Ubuntu 24.04+: /etc/apache2/sites-available/lg-for-bgp.conf
# Required modules: a2enmod proxy proxy_http rewrite headers
# Note: The Admin Portal URL path (e.g. /admin, /console, etc.) is controlled
#       directly by `admin_path` in /etc/lg-for-bgp/config.yaml.
# ==============================================================================

<VirtualHost *:80>
    ServerName lg.example.com
    DocumentRoot /var/www/lg-for-bgp/ui/dist

    # 1. Reverse Proxy /api/* to Go Backend Server
    ProxyPreserveHost On
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    # 2. Static Frontend & SPA Fallback
    <Directory /var/www/lg-for-bgp/ui/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule . /index.html [L]
    </Directory>
</VirtualHost>
