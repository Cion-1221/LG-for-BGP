# ==============================================================================
# Nginx Configuration for Separated Frontend (UI/dist) + Backend (lg-server)
# File Path on Debian 13 / Ubuntu 24.04+: /etc/nginx/sites-available/lg-for-bgp.conf
# Note: The Admin Portal URL path (e.g. /admin, /console, etc.) is controlled
#       directly by `admin_path` in /etc/lg-for-bgp/config.yaml.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/lg-for-bgp/ui/dist;
    index index.html;

    # 1. Reverse Proxy Backend REST API (/api/v1/*) to Go Backend Server
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 2. Serve Static Frontend Bundle & SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
