# ==============================================================================
# Native Linux systemd service units for Debian 13 (Trixie), Ubuntu 24.04+, & VyOS
# Ready-to-copy standalone unit files are also available in `deploy/systemd/*.service`.
# ==============================================================================

# 1. /etc/systemd/system/gobgpd.service (deploy/systemd/gobgpd.service)
[Unit]
Description=GoBGP Routing Daemon (Read-Only Route Collector)
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User=root
ExecStart=/usr/local/bin/gobgpd -f /etc/gobgp/gobgpd.conf --api-hosts=127.0.0.1:50051
Restart=always
RestartSec=3
LimitNOFILE=65536

[Install]
WantedBy=multi-user.target

# 2. /etc/systemd/system/lg-server.service (deploy/systemd/lg-server.service)
#    Runs under dedicated non-root system user `lg-bgp`.
#    Reads server, database (mysql/mariadb or sqlite), jwt, and log settings from /etc/lg-for-bgp/config.yaml
[Unit]
Description=LG-for-BGP Multi-Instance Looking Glass API Server
After=network-online.target mariadb.service mysql.service
Wants=network-online.target

[Service]
Type=simple
User=lg-bgp
Group=lg-bgp
WorkingDirectory=/opt/lg-for-bgp
ExecStart=/opt/lg-for-bgp/lg-server -config /etc/lg-for-bgp/config.yaml
Restart=always
RestartSec=3
NoNewPrivileges=true
PrivateTmp=true
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=/var/lib/lg-for-bgp /var/log/lg-for-bgp /opt/lg-for-bgp

[Install]
WantedBy=multi-user.target

# 3. /etc/systemd/system/lg-agent.service (deploy/systemd/lg-agent.service)
#    Allows central lg-server to query remote BIRD 2 or FRR nodes over authenticated HTTP(S) without SSH.
[Unit]
Description=LG-for-BGP Lightweight Remote BGP Collector Agent (BIRD 2 / FRR)
After=network-online.target frr.service bird.service
Wants=network-online.target

[Service]
Type=simple
WorkingDirectory=/opt/lg-for-bgp
# Optional TLS flags: -tls-cert /etc/lg-for-bgp/agent.crt -tls-key /etc/lg-for-bgp/agent.key
ExecStart=/opt/lg-for-bgp/lg-agent -listen 0.0.0.0:9090 -engine auto -socket local -token ChangeMe_StrongAgentToken_2026
Restart=always
RestartSec=3
NoNewPrivileges=true
PrivateTmp=true

[Install]
WantedBy=multi-user.target
