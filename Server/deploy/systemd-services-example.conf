# ==============================================================================
# Native Linux systemd service units for Debian 13 (Trixie), Ubuntu 24.04+, & VyOS
# ==============================================================================

# 1. /etc/systemd/system/gobgpd.service
[Unit]
Description=GoBGP Routing Daemon (Read-Only Route Collector)
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User=root
ExecStart=/usr/local/bin/gobgpd -f /etc/gobgp/gobgpd.conf --api-hosts=127.0.0.1:50051
Restart=always
RestartSec=3
LimitNOFILE=65536

[Install]
WantedBy=multi-user.target

# 2. /etc/systemd/system/lg-server.service
#    Reads server, database (mysql/mariadb or sqlite), jwt, and log settings from /etc/lg-for-bgp/config.yaml
#    Note: When using SQLite (e.g. on VyOS), mariadb.service / mysql.service are not required.
[Unit]
Description=LG-for-BGP Multi-Instance Looking Glass API Server
After=network-online.target mariadb.service mysql.service
Wants=network-online.target

[Service]
Type=simple
WorkingDirectory=/opt/lg-for-bgp
ExecStart=/opt/lg-for-bgp/lg-server -config /etc/lg-for-bgp/config.yaml
Restart=always
RestartSec=3

[Install]
WantedBy=multi-user.target

# 3. /etc/systemd/system/lg-agent.service (Optional: deploy on remote BIRD 2 / FRR / VyOS RR nodes)
#    Allows central lg-server to query remote BIRD 2 or FRR nodes over authenticated HTTP(S) without SSH.
[Unit]
Description=LG-for-BGP Lightweight Remote BGP Collector Agent (BIRD 2 / FRR)
After=network-online.target frr.service bird.service
Wants=network-online.target

[Service]
Type=simple
ExecStart=/opt/lg-for-bgp/lg-agent -listen 0.0.0.0:9090 -engine auto -socket local -token ChangeMe_StrongAgentToken_2026
Restart=always
RestartSec=3

[Install]
WantedBy=multi-user.target
