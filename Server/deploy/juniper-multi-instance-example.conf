# ==============================================================================
# Juniper Junos Multi-Instance Configuration Template for BGP Looking Glass
# (Uses RFC 5398 Documentation ASN 65000 — Replace with your own ASN/instances)
# Architecture:
#   - Multiple isolated BGP contexts (logical-systems & routing-instances)
#     peering with a single Loopback IP on GoBGP / BIRD 2 / FRR RR-01 & RR-02
#   - 100% Original Next-Hop & BGP Attributes (NO next-hop self)
#   - BGP Add-Path Send enabled (sends Best Path + backup paths)
#   - BGP Graceful Restart enabled
#   - Strictly Read-Only (IMPORT-NONE rejects any routes from RR)
# ==============================================================================

# 1. Loopback Source Addresses for the 4 BGP Contexts
set logical-systems LSYS-OPT interfaces lo0 unit 1 family inet address 10.255.0.1/32
set logical-systems LSYS-OPT interfaces lo0 unit 1 family inet6 address fd00:6500::1/128

set interfaces lo0 unit 10 description "VRF-DIA LG Source Loopback"
set interfaces lo0 unit 10 family inet address 10.255.0.10/32
set interfaces lo0 unit 10 family inet6 address fd00:6500::10/128

set interfaces lo0 unit 20 description "VRF-TRANSIT-A LG Source Loopback"
set interfaces lo0 unit 20 family inet address 10.255.0.20/32
set interfaces lo0 unit 20 family inet6 address fd00:6500::20/128

set interfaces lo0 unit 30 description "VRF-TRANSIT-B LG Source Loopback"
set interfaces lo0 unit 30 family inet address 10.255.0.30/32
set interfaces lo0 unit 30 family inet6 address fd00:6500::30/128

# 2. Pure Read-Only Policies (Export All Unmodified, Import None)
set policy-options policy-statement LG-IMPORT-NONE then reject
set policy-options policy-statement LG-EXPORT-RAW then accept

set logical-systems LSYS-OPT policy-options policy-statement LG-IMPORT-NONE then reject
set logical-systems LSYS-OPT policy-options policy-statement LG-EXPORT-RAW then accept

# 3. Context #1: logical-systems LSYS-OPT
set logical-systems LSYS-OPT protocols bgp group LG-GOBGP-RR type internal
set logical-systems LSYS-OPT protocols bgp group LG-GOBGP-RR local-address 10.255.0.1
set logical-systems LSYS-OPT protocols bgp group LG-GOBGP-RR import LG-IMPORT-NONE
set logical-systems LSYS-OPT protocols bgp group LG-GOBGP-RR export LG-EXPORT-RAW
set logical-systems LSYS-OPT protocols bgp group LG-GOBGP-RR graceful-restart
set logical-systems LSYS-OPT protocols bgp group LG-GOBGP-RR family inet unicast add-path send path-count 6
set logical-systems LSYS-OPT protocols bgp group LG-GOBGP-RR family inet6 unicast add-path send path-count 6
set logical-systems LSYS-OPT protocols bgp group LG-GOBGP-RR neighbor 10.255.255.101
set logical-systems LSYS-OPT protocols bgp group LG-GOBGP-RR neighbor 10.255.255.102

# 4. Context #2: routing-instances VRF-DIA
set routing-instances VRF-DIA interface lo0.10
set routing-instances VRF-DIA protocols bgp group LG-GOBGP-RR type internal
set routing-instances VRF-DIA protocols bgp group LG-GOBGP-RR local-address 10.255.0.10
set routing-instances VRF-DIA protocols bgp group LG-GOBGP-RR import LG-IMPORT-NONE
set routing-instances VRF-DIA protocols bgp group LG-GOBGP-RR export LG-EXPORT-RAW
set routing-instances VRF-DIA protocols bgp group LG-GOBGP-RR graceful-restart
set routing-instances VRF-DIA protocols bgp group LG-GOBGP-RR family inet unicast add-path send path-count 6
set routing-instances VRF-DIA protocols bgp group LG-GOBGP-RR family inet6 unicast add-path send path-count 6
set routing-instances VRF-DIA protocols bgp group LG-GOBGP-RR neighbor 10.255.255.101
set routing-instances VRF-DIA protocols bgp group LG-GOBGP-RR neighbor 10.255.255.102

# 5. Context #3: routing-instances VRF-TRANSIT-A
set routing-instances VRF-TRANSIT-A interface lo0.20
set routing-instances VRF-TRANSIT-A protocols bgp group LG-GOBGP-RR type internal
set routing-instances VRF-TRANSIT-A protocols bgp group LG-GOBGP-RR local-address 10.255.0.20
set routing-instances VRF-TRANSIT-A protocols bgp group LG-GOBGP-RR import LG-IMPORT-NONE
set routing-instances VRF-TRANSIT-A protocols bgp group LG-GOBGP-RR export LG-EXPORT-RAW
set routing-instances VRF-TRANSIT-A protocols bgp group LG-GOBGP-RR graceful-restart
set routing-instances VRF-TRANSIT-A protocols bgp group LG-GOBGP-RR family inet unicast add-path send path-count 6
set routing-instances VRF-TRANSIT-A protocols bgp group LG-GOBGP-RR family inet6 unicast add-path send path-count 6
set routing-instances VRF-TRANSIT-A protocols bgp group LG-GOBGP-RR neighbor 10.255.255.101
set routing-instances VRF-TRANSIT-A protocols bgp group LG-GOBGP-RR neighbor 10.255.255.102

# 6. Context #4: routing-instances VRF-TRANSIT-B
set routing-instances VRF-TRANSIT-B interface lo0.30
set routing-instances VRF-TRANSIT-B protocols bgp group LG-GOBGP-RR type internal
set routing-instances VRF-TRANSIT-B protocols bgp group LG-GOBGP-RR local-address 10.255.0.30
set routing-instances VRF-TRANSIT-B protocols bgp group LG-GOBGP-RR import LG-IMPORT-NONE
set routing-instances VRF-TRANSIT-B protocols bgp group LG-GOBGP-RR export LG-EXPORT-RAW
set routing-instances VRF-TRANSIT-B protocols bgp group LG-GOBGP-RR graceful-restart
set routing-instances VRF-TRANSIT-B protocols bgp group LG-GOBGP-RR family inet unicast add-path send path-count 6
set routing-instances VRF-TRANSIT-B protocols bgp group LG-GOBGP-RR family inet6 unicast add-path send path-count 6
set routing-instances VRF-TRANSIT-B protocols bgp group LG-GOBGP-RR neighbor 10.255.255.101
set routing-instances VRF-TRANSIT-B protocols bgp group LG-GOBGP-RR neighbor 10.255.255.102

# 7. Reachability to RR Single Loopback (10.255.255.101/32 & 10.255.255.102/32)
set routing-instances VRF-DIA routing-options static route 10.255.255.101/32 next-table inet.0
set routing-instances VRF-DIA routing-options static route 10.255.255.102/32 next-table inet.0
set routing-instances VRF-TRANSIT-A routing-options static route 10.255.255.101/32 next-table inet.0
set routing-instances VRF-TRANSIT-A routing-options static route 10.255.255.102/32 next-table inet.0
set routing-instances VRF-TRANSIT-B routing-options static route 10.255.255.101/32 next-table inet.0
set routing-instances VRF-TRANSIT-B routing-options static route 10.255.255.102/32 next-table inet.0
