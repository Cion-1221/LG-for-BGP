# ==============================================================================
# BIRD 2 Configuration Example for Read-Only Route Collector (RR-01)
# File Path on Debian 13 / Ubuntu 24.04+: /etc/bird/bird.conf
# (Uses RFC 5398 Documentation ASN 65000 — Replace with your own ASN)
#
# Architecture — Multi-VRF/RIB + Soft-In + Graceful Restart (GR / LLGR):
#   1. All BGP sessions listen on the single global RR Loopback IP (10.255.255.101).
#   2. Each Juniper logical-system / routing-instance is bound to its own
#      isolated in-memory BIRD routing table (`ipv4 table <VRF_NAME>;`).
#   3. Inbound Soft Reconfiguration (Soft-In / Adj-RIB-In):
#      - Every BGP channel enables `import table on;` to keep an in-memory
#        Adj-RIB-In copy of all received routes before import filtering,
#        plus `enable route refresh on;` and `enhanced route refresh on;`.
#      - Trigger inbound soft reconfiguration (Soft-In) without session reset:
#          birdc reload in peer_lsys_opt
#          birdc reload in all
#      - Inspect raw Adj-RIB-In (pre-policy received routes):
#          birdc "show route import table peer_lsys_opt.ipv4 for 8.8.8.8 all"
#   4. Graceful Restart (RFC 4724) & Long-Lived Graceful Restart (LLGR):
#      - Enabled in `template bgp lg_collector_peer` (`graceful restart on;`,
#        `graceful restart time 120;`, `long lived graceful restart on;`,
#        `long lived stale time 3600;`).
#   5. Auxiliary Next-Hop Resolution (`t_igp_resolve_v4` / `t_igp_resolve_v6`):
#      Allows BIRD 2 to recursively resolve 100% original eBGP Next-Hops and
#      compute Best-Path (*) without modifying NEXT_HOP or touching kernel FIB.
# ==============================================================================

log syslog all;
router id 10.255.255.101;

protocol device {
    scan time 10;
}

# ------------------------------------------------------------------------------
# 1. Auxiliary Next-Hop Resolution Tables (Keeps VRF RIBs 100% pure & unmodified)
# ------------------------------------------------------------------------------
ipv4 table t_igp_resolve_v4;
ipv6 table t_igp_resolve_v6;

protocol static static_resolve_v4 {
    ipv4 { table t_igp_resolve_v4; };
    route 0.0.0.0/0 blackhole;
}

protocol static static_resolve_v6 {
    ipv6 { table t_igp_resolve_v6; };
    route ::/0 blackhole;
}

# ------------------------------------------------------------------------------
# 2. Define 4 Isolated In-Memory VRF / RIB Tables (Matches `vrf_name` in Web Admin)
#    Note: In BIRD 2, table names use alphanumeric/underscore characters, or can
#    be quoted symbols like 'LSYS-OPT' in BIRD 2.0.8+.
# ------------------------------------------------------------------------------
ipv4 table 'LSYS-OPT';
ipv6 table 'LSYS-OPT-v6';

ipv4 table 'VRF-DIA';
ipv6 table 'VRF-DIA-v6';

ipv4 table 'VRF-TRANSIT-A';
ipv6 table 'VRF-TRANSIT-A-v6';

ipv4 table 'VRF-TRANSIT-B';
ipv6 table 'VRF-TRANSIT-B-v6';

# ------------------------------------------------------------------------------
# 3. BGP Template (Read-Only, Soft-In, Graceful Restart / LLGR, Add-Path RX)
# ------------------------------------------------------------------------------
template bgp lg_collector_peer {
    local 10.255.255.101 as 65000;
    passive on;
    hold time 90;
    enable route refresh on;
    enhanced route refresh on;
    graceful restart on;
    graceful restart time 120;
    long lived graceful restart on;
    long lived stale time 3600;
}

# Neighbor 1: Juniper logical-systems LSYS-OPT -> RIB 'LSYS-OPT'
protocol bgp peer_lsys_opt from lg_collector_peer {
    description "Juniper logical-systems LSYS-OPT";
    neighbor 10.255.0.1 as 65000;
    ipv4 {
        table 'LSYS-OPT';
        igp table t_igp_resolve_v4;
        import table on;   # Enables Soft-In (Adj-RIB-In retention for `birdc reload in`)
        add paths rx;
        import all;
        export none;
    };
    ipv6 {
        table 'LSYS-OPT-v6';
        igp table t_igp_resolve_v6;
        import table on;   # Enables Soft-In (Adj-RIB-In retention for `birdc reload in`)
        add paths rx;
        import all;
        export none;
    };
}

# Neighbor 2: Juniper routing-instances VRF-DIA -> RIB 'VRF-DIA'
protocol bgp peer_vrf_dia from lg_collector_peer {
    description "Juniper routing-instances VRF-DIA";
    neighbor 10.255.0.10 as 65000;
    ipv4 {
        table 'VRF-DIA';
        igp table t_igp_resolve_v4;
        import table on;   # Enables Soft-In (Adj-RIB-In retention for `birdc reload in`)
        add paths rx;
        import all;
        export none;
    };
    ipv6 {
        table 'VRF-DIA-v6';
        igp table t_igp_resolve_v6;
        import table on;   # Enables Soft-In (Adj-RIB-In retention for `birdc reload in`)
        add paths rx;
        import all;
        export none;
    };
}

# Neighbor 3: Juniper routing-instances VRF-TRANSIT-A -> RIB 'VRF-TRANSIT-A'
protocol bgp peer_vrf_transit_a from lg_collector_peer {
    description "Juniper routing-instances VRF-TRANSIT-A";
    neighbor 10.255.0.20 as 65000;
    ipv4 {
        table 'VRF-TRANSIT-A';
        igp table t_igp_resolve_v4;
        import table on;   # Enables Soft-In (Adj-RIB-In retention for `birdc reload in`)
        add paths rx;
        import all;
        export none;
    };
    ipv6 {
        table 'VRF-TRANSIT-A-v6';
        igp table t_igp_resolve_v6;
        import table on;   # Enables Soft-In (Adj-RIB-In retention for `birdc reload in`)
        add paths rx;
        import all;
        export none;
    };
}

# Neighbor 4: Juniper routing-instances VRF-TRANSIT-B -> RIB 'VRF-TRANSIT-B'
protocol bgp peer_vrf_transit_b from lg_collector_peer {
    description "Juniper routing-instances VRF-TRANSIT-B";
    neighbor 10.255.0.30 as 65000;
    ipv4 {
        table 'VRF-TRANSIT-B';
        igp table t_igp_resolve_v4;
        import table on;   # Enables Soft-In (Adj-RIB-In retention for `birdc reload in`)
        add paths rx;
        import all;
        export none;
    };
    ipv6 {
        table 'VRF-TRANSIT-B-v6';
        igp table t_igp_resolve_v6;
        import table on;   # Enables Soft-In (Adj-RIB-In retention for `birdc reload in`)
        add paths rx;
        import all;
        export none;
    };
}
