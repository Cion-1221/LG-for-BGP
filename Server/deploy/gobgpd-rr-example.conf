# ==============================================================================
# GoBGP Configuration Example for Read-Only Route Collector (RR-01)
# File Path on Linux RR: /etc/gobgp/gobgpd.conf
# (Uses RFC 5398 Documentation ASN 65000 — Replace with your own ASN)
#
# Architecture — Multi-VRF + Soft-In + Graceful Restart (GR / LLGR):
#   1. Each Juniper logical-system / routing-instance is mapped to its own
#      isolated in-memory VRF RIB (`[[vrfs]]`) inside GoBGP using distinct RD/RTs.
#   2. Each neighbor specifies `vrf = "<VRF-NAME>"` under `[neighbors.config]`.
#   3. Inbound Soft Reconfiguration (Soft-In / Adj-RIB-In):
#      - GoBGP natively maintains an in-memory `Adj-RIB-In` table per neighbor
#        and automatically enables BGP Route Refresh (RFC 2918 / RFC 7313).
#      - Trigger inbound soft reconfiguration without dropping BGP sessions:
#          gobgp neighbor 10.255.0.1 softresetin
#          gobgp neighbor all softresetin -a ipv4
#      - Inspect raw pre-policy Adj-RIB-In routes from a neighbor:
#          gobgp neighbor 10.255.0.1 adj-in -a ipv4
#   4. Graceful Restart (RFC 4724) & Long-Lived Graceful Restart (LLGR):
#      - Enabled globally and per neighbor/AFI-SAFI (`mp-graceful-restart` &
#        `long-lived-graceful-restart`) so routes remain available in the
#        Looking Glass during upstream router RE switchovers or daemon restarts
#        until End-of-RIB (EoR) is received.
#   5. Query a specific VRF instance RIB:
#        gobgp global rib 8.8.8.8/32 rd 65000:1 shorter-prefixes -a vpnv4
# ==============================================================================

[global.config]
  as = 65000
  router-id = "10.255.255.101"
  port = 179
  local-address-list = ["10.255.255.101"]

[global.apply-policy.config]
  default-import-policy = "accept-route"
  default-export-policy = "reject-route"

[global.graceful-restart.config]
  enabled = true
  restart-time = 120
  stale-routes-time = 360
  helper-only = true

# ------------------------------------------------------------------------------
# 1. Define 4 Isolated In-Memory VRF RIBs (One per Juniper Instance)
#    Distinct RDs & RTs ensure routes NEVER leak or mix between instances.
# ------------------------------------------------------------------------------
[[vrfs]]
  [vrfs.config]
    name = "LSYS-OPT"
    id = 1
    rd = "65000:1"
    both-rt-list = ["65000:1"]

[[vrfs]]
  [vrfs.config]
    name = "VRF-DIA"
    id = 10
    rd = "65000:10"
    both-rt-list = ["65000:10"]

[[vrfs]]
  [vrfs.config]
    name = "VRF-TRANSIT-A"
    id = 20
    rd = "65000:20"
    both-rt-list = ["65000:20"]

[[vrfs]]
  [vrfs.config]
    name = "VRF-TRANSIT-B"
    id = 30
    rd = "65000:30"
    both-rt-list = ["65000:30"]

# ------------------------------------------------------------------------------
# 2. Bind Each Juniper Instance Neighbor to Its Dedicated VRF RIB
#    (Includes Soft-In Policy + Graceful Restart / LLGR + Add-Path RX)
# ------------------------------------------------------------------------------

# Neighbor 1: Juniper logical-systems LSYS-OPT -> VRF RIB "LSYS-OPT"
[[neighbors]]
  [neighbors.config]
    neighbor-address = "10.255.0.1"
    peer-as = 65000
    vrf = "LSYS-OPT"
    description = "Juniper logical-systems LSYS-OPT"
  [neighbors.transport.config]
    local-address = "10.255.255.101"
  [neighbors.apply-policy.config]
    default-import-policy = "accept-route"
    default-export-policy = "reject-route"
  [neighbors.graceful-restart.config]
    enabled = true
    restart-time = 120
    stale-routes-time = 360
    helper-only = true
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-unicast"
    [neighbors.afi-safis.add-paths.config]
      receive = true
    [neighbors.afi-safis.mp-graceful-restart.config]
      enabled = true
    [neighbors.afi-safis.long-lived-graceful-restart.config]
      enabled = true
      restart-time = 3600
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv6-unicast"
    [neighbors.afi-safis.add-paths.config]
      receive = true
    [neighbors.afi-safis.mp-graceful-restart.config]
      enabled = true
    [neighbors.afi-safis.long-lived-graceful-restart.config]
      enabled = true
      restart-time = 3600

