! ==============================================================================
! FRRouting (FRR) Configuration Example for Read-Only Route Collector (RR-01)
! File Path on Debian 13 / Ubuntu 24.04+: /etc/frr/frr.conf
! (Uses RFC 5398 Documentation ASN 65000 — Replace with your own ASN)
!
! Architecture — Multi-VRF/RIB + Soft-In + Graceful Restart (GR):
!   1. Uses FRR's native `router bgp <ASN> view <VRF_NAME>` (BGP View mode).
!   2. Unlike kernel VRFs, a BGP `view` in FRR is a pure in-memory BGP RIB
!      that NEVER installs routes into the Linux kernel (Zebra) and shares the
!      single global Loopback IP (10.255.255.101:179)!
!   3. Inbound Soft Reconfiguration (Soft-In / Adj-RIB-In):
!      - Every neighbor enables `soft-reconfiguration inbound` under both
!        `address-family ipv4 unicast` and `address-family ipv6 unicast`.
!      - Trigger inbound soft reconfiguration without resetting BGP peerings:
!          vtysh -c "clear bgp view VRF-DIA 10.255.0.10 soft in"
!          vtysh -c "clear bgp view VRF-DIA * soft in"
!      - Inspect raw pre-policy Adj-RIB-In (`received-routes`):
!          vtysh -c "show bgp view VRF-DIA ipv4 unicast neighbors 10.255.0.10 received-routes"
!   4. Graceful Restart (RFC 4724):
!      - Enabled per BGP View (`bgp graceful-restart`, `restart-time 120`,
!        `stalepath-time 360`) and per neighbor (`graceful-restart-helper`).
!   5. Queries use structured JSON:
!        vtysh -c "show bgp view VRF-DIA ipv4 unicast 8.8.8.0/24 json"
! ==============================================================================
frr defaults traditional
hostname rr-01-frr
log syslog informational
service integrated-vtysh-config
!
route-map RM-IMPORT-ALL permit 10
!
route-map RM-EXPORT-NONE deny 10
!
! ------------------------------------------------------------------------------
! View 1: LSYS-OPT (Matches `vrf_name = LSYS-OPT` in Web Admin)
! ------------------------------------------------------------------------------
router bgp 65000 view LSYS-OPT
 bgp router-id 10.255.255.101
 no bgp default ipv4-unicast
 no bgp network import-check
 bgp graceful-restart
 bgp graceful-restart restart-time 120
 bgp graceful-restart stalepath-time 360
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source 10.255.255.101
 neighbor 10.255.0.1 description Juniper logical-systems LSYS-OPT
 neighbor 10.255.0.1 graceful-restart-helper
 !
 address-family ipv4 unicast
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 addpath-rx
  neighbor 10.255.0.1 soft-reconfiguration inbound
  neighbor 10.255.0.1 route-map RM-IMPORT-ALL in
  neighbor 10.255.0.1 route-map RM-EXPORT-NONE out
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 addpath-rx
  neighbor 10.255.0.1 soft-reconfiguration inbound
  neighbor 10.255.0.1 route-map RM-IMPORT-ALL in
  neighbor 10.255.0.1 route-map RM-EXPORT-NONE out
 exit-address-family
exit
!
