name: Build & Package BGP Looking Glass

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    name: Test & Build Go Backend (Server)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go (Latest Stable)
        uses: actions/setup-go@v5
        with:
          go-version-file: 'Server/go.mod'
          check-latest: true
          cache-dependency-path: Server/go.sum

      - name: Run Security & Unit Tests
        run: go test -v ./...

      - name: Build Linux amd64 Static Binaries (lg-server + lg-agent)
        run: |
          mkdir -p ../dist-artifacts
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist-artifacts/lg-server-linux-amd64 ./cmd/lg-server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist-artifacts/lg-agent-linux-amd64 ./cmd/lg-agent

      - name: Build Linux arm64 Static Binaries (lg-server + lg-agent)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist-artifacts/lg-server-linux-arm64 ./cmd/lg-server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist-artifacts/lg-agent-linux-arm64 ./cmd/lg-agent

      - name: Upload Backend Binaries
        uses: actions/upload-artifact@v4
        with:
          name: lg-server-binaries
          path: dist-artifacts/*

  build-frontend:
    name: Build React Frontend (UI)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: UI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & Build UI
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: lg-ui-dist
          path: UI/dist/

  package-release:
    name: Package Full Deployment Bundle
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Backend Binaries
        uses: actions/download-artifact@v4
        with:
          name: lg-server-binaries
          path: build-out/bin

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: lg-ui-dist
          path: build-out/ui/dist

      - name: Assemble Release Bundles & SHA256 Checksums
        run: |
          mkdir -p release-pkg/lg-for-bgp-linux-amd64/ui
          cp build-out/bin/lg-server-linux-amd64 release-pkg/lg-for-bgp-linux-amd64/lg-server
          cp build-out/bin/lg-agent-linux-amd64 release-pkg/lg-for-bgp-linux-amd64/lg-agent
          chmod +x release-pkg/lg-for-bgp-linux-amd64/lg-server release-pkg/lg-for-bgp-linux-amd64/lg-agent
          cp Server/config.yaml release-pkg/lg-for-bgp-linux-amd64/config.yaml
          cp -r build-out/ui/dist release-pkg/lg-for-bgp-linux-amd64/ui/
          cp -r Server/deploy release-pkg/lg-for-bgp-linux-amd64/
          chmod +x release-pkg/lg-for-bgp-linux-amd64/deploy/install-debian13-ubuntu24.sh
          cp README.md README.zh-CN.md release-pkg/lg-for-bgp-linux-amd64/

          tar -czf release-pkg/lg-for-bgp-linux-amd64.tar.gz -C release-pkg lg-for-bgp-linux-amd64

          mkdir -p release-pkg/lg-for-bgp-linux-arm64/ui
          cp build-out/bin/lg-server-linux-arm64 release-pkg/lg-for-bgp-linux-arm64/lg-server
          cp build-out/bin/lg-agent-linux-arm64 release-pkg/lg-for-bgp-linux-arm64/lg-agent
          chmod +x release-pkg/lg-for-bgp-linux-arm64/lg-server release-pkg/lg-for-bgp-linux-arm64/lg-agent
          cp Server/config.yaml release-pkg/lg-for-bgp-linux-arm64/config.yaml
          cp -r build-out/ui/dist release-pkg/lg-for-bgp-linux-arm64/ui/
          cp -r Server/deploy release-pkg/lg-for-bgp-linux-arm64/
          chmod +x release-pkg/lg-for-bgp-linux-arm64/deploy/install-debian13-ubuntu24.sh
          cp README.md README.zh-CN.md release-pkg/lg-for-bgp-linux-arm64/

          tar -czf release-pkg/lg-for-bgp-linux-arm64.tar.gz -C release-pkg lg-for-bgp-linux-arm64

          (cd release-pkg && sha256sum lg-for-bgp-linux-amd64.tar.gz lg-for-bgp-linux-arm64.tar.gz > SHA256SUMS.txt)

      - name: Upload Combined Deployment Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lg-for-bgp-deployment-bundles
          path: |
            release-pkg/lg-for-bgp-linux-amd64.tar.gz
            release-pkg/lg-for-bgp-linux-arm64.tar.gz
            release-pkg/SHA256SUMS.txt

      - name: Publish GitHub Release (Version Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} — Official Release"
          files: |
            release-pkg/lg-for-bgp-linux-amd64.tar.gz
            release-pkg/lg-for-bgp-linux-arm64.tar.gz
            release-pkg/SHA256SUMS.txt
          generate_release_notes: true
